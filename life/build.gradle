plugins {
    id 'net.fabricmc.fabric-loom'
}

// Shinobi Life (ROADMAP.md, "The pack: separate mods"): the player's wallet and the shops, on the ryo economy
// (`:life:economy`, shipped inside its jar) and the compiled item data in data/items/.
version = '0.1.0'
group = 'dev.shinobi'
base { archivesName = 'shinobi-life' }

loom {
    mods {
        shinobi_life { sourceSet sourceSets.main }
    }
}

repositories { mavenCentral() }
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    implementation project(':life:economy')
    include project(':life:economy')
    implementation project(':life:home')   // comfort's Well Rested (docs/HOME.md); it brings the bond engine
    include project(':life:home')
    include project(':life:bonds')
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
    from(rootProject.file('data/items')) { include 'items.json', 'shops.json', 'recipes.json', 'kits.json', 'economy.json'; into 'data/shinobi_life/items' }
}
tasks.withType(JavaCompile).configureEach { options.release = 25; options.encoding = 'UTF-8' }
java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
