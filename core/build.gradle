plugins {
    id 'net.fabricmc.fabric-loom'
}

// Shinobi Core (ROADMAP.md, "The pack: separate mods"): the shared lower layer every Shinobi mod
// builds on. It depends on Fabric API only. Run it with `./gradlew :core:runClient`; the launch check
// is `./gradlew :core:runClientGameTest` (a real client opens a world and saves a screenshot).
version = '0.1.0'
group = 'dev.shinobi'
base { archivesName = 'shinobi-core' }

loom {
    splitEnvironmentSourceSets()
    mods {
        shinobi_core {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

repositories { mavenCentral() }
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}
tasks.withType(JavaCompile).configureEach { options.release = 25; options.encoding = 'UTF-8' }
java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'shinobi_core_tests'
        enableGameTests = false
        enableClientGameTests = true
        eula = true
        clearRunDirectory = false
        username = 'ShinobiTester'
    }
}

// `-Ppack` runs the launch check with the pack's whole mod set: the pinned Village Friends jar joins it.
if (providers.gradleProperty('pack').isPresent()) {
    dependencies { gametestRuntimeOnly files(rootProject.vfJar) }
    tasks.named('runClientGameTest') { dependsOn ':pack:verifyPins' }
}

loom.runs {
    client { programArgs '--username', 'ShinobiTester' }
}
