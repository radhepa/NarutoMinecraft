plugins {
    id 'net.fabricmc.fabric-loom'
}

// Shinobi Core (ROADMAP.md, "The pack: separate mods"): the shared lower layer every Shinobi mod
// builds on. It depends on Fabric API only. Run it with `./gradlew :core:runClient`; the launch check
// is `./gradlew :core:runClientGameTest` (a real client opens a world and saves a screenshot).
version = '0.1.0'
group = 'dev.shinobi'
base { archivesName = 'shinobi-core' }

loom {
    splitEnvironmentSourceSets()
    mods {
        shinobi_core {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

repositories { mavenCentral() }
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    testImplementation project(':life:bonds')   // only to prove Core's seed streams give the engines' numbers
    testImplementation platform('org.junit:junit-bom:5.14.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
test {
    useJUnitPlatform()
    testLogging { events 'failed'; exceptionFormat 'full' }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}
tasks.withType(JavaCompile).configureEach { options.release = 25; options.encoding = 'UTF-8' }
java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'shinobi_core_tests'
        enableGameTests = false
        enableClientGameTests = true
        eula = true
        clearRunDirectory = false
        username = 'ShinobiTester'
    }
}

// `-Ppack` runs the launch check with the pack's whole mod set: the pinned Village Friends jar and the other Shinobi mods join it.
if (providers.gradleProperty('pack').isPresent()) {
    // Resolved late: those mods build on Core, so Core cannot evaluate them first.
    def mods = [':village', ':life', ':combat', ':progression']
    def jars = files { mods.collect { rootProject.project(it).tasks.named('jar').get().archiveFile } }.builtBy(mods.collect { "$it:jar" })
    dependencies { gametestRuntimeOnly files(rootProject.vfJar, jars) }
    tasks.named('runClientGameTest') { dependsOn ':pack:verifyPins' }
}

loom.runs {
    client { programArgs '--username', 'ShinobiTester' }
}
