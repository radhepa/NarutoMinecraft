plugins {
    id 'net.fabricmc.fabric-loom'
}

// Shinobi Combat (ROADMAP.md, "The pack: separate mods"): the fights, on the combat core (`:combat:core`, shipped
// inside its jar) and the authored data in data/combat/. The client check is `./gradlew :combat:runClientGameTest`
// (the Academy techniques, guard and the HUD in a real world, with screenshots).
version = '0.1.0'
group = 'dev.shinobi'
base { archivesName = 'shinobi-combat' }

loom {
    splitEnvironmentSourceSets()
    mods {
        shinobi_combat {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

repositories { mavenCentral() }
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    implementation project(':combat:core')
    include project(':combat:core')
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
    from(rootProject.file('data/combat')) { into 'data/shinobi_combat/combat' }
}
tasks.withType(JavaCompile).configureEach { options.release = 25; options.encoding = 'UTF-8' }
java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'shinobi_combat_tests'
        enableGameTests = false
        enableClientGameTests = true
        eula = true
        clearRunDirectory = false
        username = 'ShinobiTester'
    }
}

loom.runs {
    client { programArgs '--username', 'ShinobiTester' }
}
