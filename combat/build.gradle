plugins {
    id 'net.fabricmc.fabric-loom'
}

// Shinobi Combat (ROADMAP.md, "The pack: separate mods"): the fights, on the combat core (`:combat:core`, shipped
// inside its jar) and the authored data in data/combat/.
version = '0.1.0'
group = 'dev.shinobi'
base { archivesName = 'shinobi-combat' }

loom {
    mods {
        shinobi_combat { sourceSet sourceSets.main }
    }
}

repositories { mavenCentral() }
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    implementation project(':combat:core')
    include project(':combat:core')
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
    from(rootProject.file('data/combat')) { into 'data/shinobi_combat/combat' }
}
tasks.withType(JavaCompile).configureEach { options.release = 25; options.encoding = 'UTF-8' }
java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
